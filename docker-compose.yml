services:
  monitor:
    build:
      context: .
    image: korefi-workflow-monitor:latest
    container_name: korefi-workflow-monitor
    restart: unless-stopped
    # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, plus the MONITOR_DOMAIN /
    # TRAEFIK_* values used by the labels below.
    # Read at container start — `docker compose up -d` after editing .env.
    env_file: .env
    # No `ports:` on purpose. Traefik runs with network_mode: host on this VPS
    # (see /docker/traefik/docker-compose.yml) and reaches containers straight
    # over the Docker bridge network via the socket-based provider below — it
    # does not need to share a user-defined network with them. Publishing a
    # host port here would additionally expose the app on the VPS's public IP
    # and bypass the firewall, since Docker writes its own iptables rules.
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"

      # --- HTTPS router ---
      - "traefik.http.routers.monitor.rule=Host(`${MONITOR_DOMAIN}`)"
      - "traefik.http.routers.monitor.entrypoints=${TRAEFIK_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.monitor.tls=true"
      - "traefik.http.routers.monitor.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.monitor.service=monitor"

      # --- HTTP router: redirect to HTTPS ---
      - "traefik.http.routers.monitor-http.rule=Host(`${MONITOR_DOMAIN}`)"
      - "traefik.http.routers.monitor-http.entrypoints=${TRAEFIK_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.monitor-http.middlewares=monitor-redirect"
      - "traefik.http.middlewares.monitor-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.monitor-redirect.redirectscheme.permanent=true"

      # --- Backend ---
      # Required whenever the image EXPOSEs more than nothing ambiguous; also the
      # only way Traefik learns the port when no host port is published.
      - "traefik.http.services.monitor.loadbalancer.server.port=3000"
      # No auth in front of this, and none inside the app either: anyone with
      # the URL can read the dashboard and the three /api routes, lead names,
      # phone numbers and WhatsApp message text included.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# No top-level `networks:` block on purpose — Traefik's docker provider
# (network_mode: host + the mounted socket) finds this container on whatever
# network `docker compose` creates for this project by default. That only
# works because the container has exactly one network; if it's ever attached
# to a second one, add a "traefik.docker.network=<name>" label to disambiguate.
