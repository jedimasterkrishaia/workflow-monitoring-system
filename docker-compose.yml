services:
  monitor:
    build:
      context: .
    image: korefi-workflow-monitor:latest
    container_name: korefi-workflow-monitor
    restart: unless-stopped
    # SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BASIC_AUTH_USER, BASIC_AUTH_PASS.
    # Read at container start — `docker compose up -d` after editing .env.
    env_file: .env
    ports:
      # Bound to loopback: nginx terminates TLS and proxies to localhost:3000.
      # Publishing "3000:3000" instead would expose the app on the VPS's public
      # IP and bypass the firewall, since Docker writes its own iptables rules.
      - "127.0.0.1:3000:3000"
    healthcheck:
      # 401 is a healthy answer here — Basic Auth is doing its job.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
